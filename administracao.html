<style>
/* ============================================================
   ACESS PORT — ADMINISTRAÇÃO GERAL
   Shell visual: seucondominio + paleta verde-tarde
   Estrutura original 100% preservada (IDs, classes, JS).
   ============================================================ */

/* ---------- Tokens base (verde-tarde) ---------- */
:root{
  --navy:#3b5a3f;              /* antes #10243a */
  --navy2:#2f4a33;             /* antes #142d48 */
  --blue:#3f7a4a;              /* antes #2168d5 — botões primários */
  --gold:#e7bd4a;              /* mantido */
  --bg:#f3f7f3;                /* antes #f3f6fb — fundo levemente esverdeado */
  --ink:#1f3d24;               /* antes #14283f */
  --muted:#6b7f6e;             /* antes #667991 */
  --line:#dfe7e0;              /* antes #dfe7f1 */
  --white:#fff;
  --red:#b42318;               /* mantido */
  --green:#14804a;             /* mantido */
  /* Shell verde-tarde */
  --sc-shell-fundo:#3b5a3f;
  --sc-shell-fundo-2:#2f4a33;
  --sc-shell-hover:#4a6b4e;
  --sc-shell-texto:#ffffff;
  --sc-shell-texto-suave:#c8dcc0;
  --sc-shell-borda:#2f4a33;
  --sc-shell-destaque:#8fbf7a;
  /* Acess Port camada #app */
  --ap-sidebar:#3b5a3f;
  --ap-sidebar-soft:#4a6b4e;
  --ap-accent:#e7bd4a;
  --ap-blue:#3f7a4a;
  --ap-canvas:#f3f7f3;
  --ap-border:#e3eae4;
  --ap-shadow:0 8px 24px rgba(31,61,36,.055);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  font:15px/1.45 Inter,system-ui,Arial;
  color:var(--ink);
}
button,input,select,textarea{font:inherit}
button{
  cursor:pointer;border:0;border-radius:10px;padding:11px 15px;
  font-weight:700;background:var(--blue);color:#fff;
}
button.secondary{background:#e6efe6;color:var(--navy)}
button.danger{background:var(--red)}
input,select{
  width:100%;padding:12px;border:1px solid #ccd7cd;border-radius:10px;
  background:white;color:var(--ink);
}
label{display:block;font-weight:650;margin:12px 0 6px}
.hidden{display:none!important}

/* ---------- LAYOUT (shell seucondominio) ---------- */
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{
  background:var(--sc-shell-fundo);
  color:white;
  padding:24px 16px;
  border-right:1px solid var(--sc-shell-borda);
}
.brand{font-size:23px;font-weight:850;letter-spacing:.2px;margin:0 8px 5px}
.brand span{color:var(--gold)}
.subbrand{color:var(--sc-shell-texto-suave);font-size:12px;margin:0 8px 30px}
.nav{display:grid;gap:8px}
.nav button{
  background:transparent;
  color:var(--sc-shell-texto-suave);
  text-align:left;
  border-radius:10px;
  transition:background .18s ease,color .18s ease;
}
.nav button:hover,
.nav button.active{
  background:var(--sc-shell-hover);
  color:#fff;
}
.nav button:before{color:var(--gold)}
.sidefoot{
  margin-top:40px;
  color:var(--sc-shell-texto-suave);
  font-size:12px;
  padding:8px;
  border-top:1px solid #ffffff20;
}

.main{min-width:0}

/* ---------- TOPO (shell seucondominio) ---------- */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:20px 28px;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.top h1{font-size:22px;margin:0;color:var(--navy)}
.who{font-size:12px;color:var(--muted)}

.content{padding:26px;max-width:1400px;margin:auto}

/* ---------- COMPONENTES ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 14px rgba(31,61,36,.05);
}
.stat{font-size:30px;font-weight:850;margin:6px 0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tablewrap{overflow:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;background:white}
th,td{
  text-align:left;padding:12px;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
th{
  font-size:12px;text-transform:uppercase;color:var(--muted);
  background:#f4f8f4;
}
.pill{
  display:inline-block;padding:4px 9px;border-radius:999px;
  background:#e8f7ef;color:var(--green);font-size:12px;font-weight:700;
}
.pill.gold{background:#fff4d4;color:#7c5c00}
.notice{
  padding:12px 14px;border-radius:10px;
  background:#fff4d4;color:#6b5000;margin:12px 0;
}
.status{margin-top:12px;min-height:22px;color:var(--muted)}
.error{color:var(--red)}
.empty{padding:25px;text-align:center;color:var(--muted)}
.sectiontitle{margin:0 0 16px;color:var(--navy)}
.small{font-size:12px}

/* ---------- LOGIN (verde-tarde) ---------- */
.loginwrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:radial-gradient(circle at top right,#4a6b4e 0,#3b5a3f 55%,#2a3f2d 100%);
}
.login{
  background:#fff;
  width:min(440px,100%);
  border-radius:22px;
  padding:30px;
  box-shadow:0 25px 80px #0003;
}
.login .brand{color:var(--navy);margin:0}
.login p{color:var(--muted)}
.login button{width:100%;margin-top:16px}

/* ---------- Portal público ---------- */
.public-portal{width:min(560px,100%)!important;padding:clamp(20px,5vw,34px)!important;border-radius:24px!important}
.public-portal .brand{font-size:25px}
.public-portal .portal-intro{margin:8px 0 18px}
.public-portal .step-label{display:flex;align-items:center;gap:9px;font-weight:800;margin:16px 0 5px}
.public-portal .step-number{
  display:inline-grid;place-items:center;flex:0 0 28px;width:28px;height:28px;
  border-radius:50%;background:#e6efe6;color:var(--navy);font-size:13px;
}
.public-portal select{min-height:48px;font-size:16px}
.public-portal .terms-box{
  display:flex;align-items:flex-start;gap:10px;padding:13px;
  border:1px solid var(--line);border-radius:12px;background:#f4f8f4;margin-top:16px;
}
.public-portal .terms-box input{width:20px;height:20px;flex:0 0 20px;margin:2px 0 0}
.public-portal .terms-box label{margin:0;font-weight:500}
.public-portal .primary-go{
  width:100%;background:var(--green);font-size:17px;padding:15px;
  margin-top:16px;border-radius:12px;
}
.public-portal .primary-go:disabled{opacity:.6}
.public-portal .map-choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;margin:9px 0 0;background:#fff;color:var(--navy);
  border:1px solid var(--line);box-shadow:0 2px 7px rgba(31,61,36,.05);
}
.public-portal .map-choice .map-icon{
  display:grid;place-items:center;width:42px;height:42px;border-radius:12px;
  background:#eef5ee;font-size:21px;flex:0 0 42px;
}
.public-portal .map-choice small{display:block;color:var(--muted);font-weight:500}
.public-portal .map-choice:active{transform:scale(.99)}

/* ---------- Segunda tela / HDMI ---------- */
body.screen-display{margin:0!important;background:#000!important;overflow:hidden!important}
body.screen-display #loginScreen,
body.screen-display #app{display:none!important}
#publicDisplay{display:none}
body.screen-display #publicDisplay{
  display:flex!important;position:fixed;inset:0;width:100vw;height:100vh;
  background:#000;color:#fff;align-items:center;justify-content:center;
  overflow:hidden;text-align:center;
}
#publicDisplay .media-frame{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000;
}
#publicDisplay .media-frame img,
#publicDisplay .media-frame video{
  width:100%;height:100%;object-fit:contain;background:#000;
}
#publicDisplay .qr-scene{
  position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2vh;
  width:100%;height:100%;padding:3vh 3vw;background:#fff;color:var(--navy);
}
#publicDisplay .qr-scene[hidden]{display:none}
#displayPcd{
  position:absolute;inset:0;z-index:5;background:#fff;color:var(--navy);
  display:flex;align-items:center;justify-content:center;padding:6vw;
  text-align:center;font-size:clamp(30px,5vw,76px);font-weight:800;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
#displayPcd[hidden]{display:none}
#publicDisplay .qr-scene h1{font-size:clamp(24px,4vw,54px);margin:0}
#publicDisplay .qr-scene p{font-size:clamp(18px,2.2vw,32px);margin:0}
#publicDisplay .qr-scene img{
  width:min(56vh,52vw);height:min(56vh,52vw);max-width:70vw;max-height:62vh;
  object-fit:contain;background:#fff;
}
#publicDisplay .timer{
  font-size:clamp(20px,2.4vw,34px);font-weight:800;
  background:#e4f7e2;color:#14532d;padding:8px 18px;border-radius:12px;
}
#publicDisplay .display-brand{
  position:absolute;bottom:2vh;right:2vw;color:#64748b;
  font-size:clamp(10px,1vw,16px);
}
.display-text-slide{
  padding:5vw;max-width:90vw;font-size:clamp(28px,5vw,72px);font-weight:800;
  white-space:pre-wrap;overflow-wrap:anywhere;
}

/* ---------- Mídia / documentos ---------- */
.media-admin{margin-top:16px;display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}
.media-admin input[type=file]{padding:10px}
.media-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.media-list span{background:#eaf4ea;padding:7px 10px;border-radius:8px;font-size:12px}
.media-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);
}
.media-row:last-child{border-bottom:0}
.media-row .media-name{min-width:0;overflow-wrap:anywhere}
.media-row button{padding:7px 10px;font-size:12px}
.media-row .secondary{background:#e6efe6;color:var(--navy)}
.media-row .danger{background:var(--red)}
.media-panel{
  border:1px solid var(--line);border-radius:14px;padding:18px;background:#fbfdfb;
}
.media-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.media-panel-head h3{margin:0 0 5px}
.media-panel .helper{font-size:13px;color:var(--muted);margin:0}
.media-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.media-row{grid-template-columns:minmax(0,1fr) auto auto}
.document-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.document-row:last-child{border-bottom:0}
.document-name{overflow-wrap:anywhere;min-width:0}
.document-name strong{display:block}
.document-name small{color:var(--muted)}
.document-row button{padding:8px 10px;font-size:12px}
.admin-note{border-radius:10px;background:#fff5d9;color:#715500;padding:12px;font-size:13px;margin-top:12px}
.file-drop{border:1px dashed #b8c8b8;border-radius:12px;padding:14px;background:#fff}
.file-drop input[type=file]{padding:8px}

/* ---------- Dashboard / KPIs ---------- */
.dashboard-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dashboard-toolbar .actions{margin-top:0}
.dashboard-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:16px 0}
.dashboard-kpi{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fff,#f7fbf7);
  border:1px solid var(--line);border-radius:16px;padding:18px;
  box-shadow:0 6px 18px rgba(31,61,36,.05);
}
.dashboard-kpi:after{
  content:"";position:absolute;right:-22px;top:-25px;width:90px;height:90px;
  border-radius:50%;background:#3f7a4a0c;
}
.dashboard-kpi .kpi-label{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.dashboard-kpi .kpi-value{font-size:clamp(24px,2.5vw,32px);font-weight:850;letter-spacing:-.03em;margin:8px 0 4px;color:var(--navy)}
.dashboard-kpi .kpi-foot{font-size:12px;color:var(--muted)}
.dashboard-columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);gap:16px;align-items:start;margin-top:16px}
.dashboard-table{width:100%;font-size:13px}
.dashboard-table td{white-space:normal}
.dashboard-fullscreen{background:#e6efe6;color:var(--navy);border:1px solid #d6e6d6}
.dashboard-fullscreen:hover{background:#d4e6d4}
.dashboard-fullscreen-active .sidebar{display:none!important}
.dashboard-fullscreen-active .layout{grid-template-columns:1fr!important}
.dashboard-fullscreen-active .top{position:sticky;top:0;z-index:10}
.dashboard-fullscreen-active .content{max-width:1600px}
.dashboard-back-row{margin:0 0 14px}
.dashboard-back-button{display:inline-flex;align-items:center;gap:8px}
.dashboard-shortcut{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  text-align:left;background:#fff;color:var(--navy);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;
  box-shadow:0 2px 8px rgba(31,61,36,.05);
}
.dashboard-shortcut:hover{background:#f5faf5;border-color:#c8dcc8}
.dashboard-shortcut strong{display:block}
.dashboard-shortcut small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
.dashboard-shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.dashboard-mini-list{display:grid;gap:10px;margin-top:12px}
.dashboard-mini-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.dashboard-mini-item p{margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dashboard-bar-track{height:8px;background:#edf3ed;border-radius:99px;overflow:hidden;margin-top:6px}
.dashboard-bar-fill{height:100%;background:linear-gradient(90deg,#3f7a4a,#7fb069);border-radius:99px}

/* ---------- Sidebar perfil ---------- */
.side-profile{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  margin:18px 0 22px;padding:14px 8px 18px;border-bottom:1px solid #ffffff20;
}
.profile-photo-button{
  width:88px;height:88px;display:grid;place-items:center;border-radius:22px;
  background:#fff;color:var(--navy);border:3px solid rgba(231,189,74,.8);
  padding:0;overflow:hidden;box-shadow:0 4px 12px #0002;
}
.profile-photo-button img{width:100%;height:100%;object-fit:cover}
.profile-photo-button span{font-size:32px}
.sidebar-profile-name{
  font-size:13px;font-weight:750;color:#fff;text-align:center;
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sidebar-profile-hint{font-size:10px;color:var(--sc-shell-texto-suave);text-align:center}

/* ---------- Menu conta topo ---------- */
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.account-menu{position:relative;flex-shrink:0;z-index:25}
.account-trigger{
  display:flex;align-items:center;gap:8px;
  background:#fff;color:var(--navy);
  border:1px solid var(--line);padding:10px 12px;border-radius:10px;
  font-weight:700;white-space:nowrap;
}
.account-dropdown{
  position:absolute;right:0;top:calc(100% + 8px);min-width:190px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(31,61,36,.15);z-index:100;padding:6px;
}
.account-dropdown button{
  display:flex;align-items:center;gap:9px;width:100%;
  background:transparent;color:var(--ink);text-align:left;padding:10px;
  border-radius:8px;font-weight:600;
}
.account-dropdown button:hover{background:#f3f6fb}
.account-dropdown[hidden]{display:none!important}

/* ---------- Relatórios ---------- */
.report-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.report-download-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;margin:0 0 18px;align-items:stretch}
.report-download-group{
  display:flex;flex-direction:column;gap:8px;
  border:1px solid var(--line);border-radius:12px;padding:14px;
  background:#fbfdfb;min-width:0;
}
.report-download-group h3{font-size:14px;line-height:1.35;margin:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.report-download-group .actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0}
.report-download-group button{
  width:auto;min-height:34px;padding:8px 11px;border-radius:8px;
  font-size:12.5px;line-height:1.25;white-space:normal;flex:0 1 auto;
}
.report-download-group button:hover{filter:brightness(.98)}

/* ---------- Navegação contextual ---------- */
#app .nav-group{display:grid;gap:5px}
#app .nav-group-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:transparent;color:var(--sc-shell-texto-suave);text-align:left;
  border-radius:10px;padding:11px 12px;min-height:44px;
}
#app .nav-group-toggle:before{
  content:attr(data-icon);display:inline-grid;place-items:center;
  width:22px;min-width:22px;font-size:17px;line-height:1;color:var(--gold);
}
#app .nav-group-toggle.active,
#app .nav-group-toggle:hover{background:var(--sc-shell-hover);color:#fff}
#app .nav-chevron{margin-left:auto}
#app .nav-submenu{display:grid;gap:5px;padding-left:12px}
#app .nav-submenu[hidden]{display:none!important}
#app .nav-submenu button{
  font-size:14px;padding:9px 10px 9px 12px;
  border-left:2px solid var(--sc-shell-hover)!important;
  border-radius:0 8px 8px 0;
  color:var(--sc-shell-texto-suave);
}
#app .nav-submenu button.active{
  color:#fff;border-left-color:var(--gold)!important;background:rgba(255,255,255,.07);
}

/* ---------- Tabelas e scroll ---------- */
.tablewrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff}
.tablewrap table{min-width:760px}
.tablewrap th{position:sticky;top:0;z-index:1;background:#f4f8f4}
.maps-details{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.maps-details>summary{
  cursor:pointer;list-style:none;padding:14px 16px;background:#f5faf5;
  color:var(--navy);font-weight:750;display:flex;align-items:center;justify-content:space-between;
}
.maps-details>summary::-webkit-details-marker{display:none}
.maps-details>summary:after{content:'＋';font-size:18px;color:var(--blue)}
.maps-details[open]>summary:after{content:'−'}
.maps-scroll{max-height:480px;overflow:auto;border-top:1px solid var(--line)}
.maps-scroll .tablewrap{overflow:auto;max-height:480px}
.maps-scroll table{min-width:900px;width:100%;border-collapse:separate;border-spacing:0}
.maps-scroll thead th{position:sticky;top:0;z-index:2;background:#f7faf7}
.maps-scroll td,.maps-scroll th{padding:14px;vertical-align:middle}
.maps-count{font-weight:600;color:var(--muted)}

/* ---------- Responsivo ---------- */
@media(max-width:1100px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout{grid-template-columns:220px minmax(0,1fr)}
  .content{padding:18px}
  .report-download-groups{grid-template-columns:1fr}
}
@media(max-width:900px){
  .dashboard-columns{grid-template-columns:1fr}
  .dashboard-kpis{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
  .dashboard-kpi{padding:14px}
}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:relative;top:0;height:auto;min-height:0;max-height:none;padding:13px 14px 12px;border-right:0;border-bottom:1px solid var(--sc-shell-borda)}
  .subbrand,.sidefoot{display:none}
  .nav{display:flex;overflow-x:auto;gap:6px;padding:2px 0 5px}
  .nav button{width:auto;white-space:nowrap;padding:9px;font-size:11px}
  .top{padding:14px 16px;align-items:flex-start}
  .content{padding:14px}
  .grid{grid-template-columns:1fr}
  .formrow{grid-template-columns:1fr}
  .report-filters{grid-template-columns:1fr}
  .top h1{font-size:18px}
  .dashboard-columns{grid-template-columns:1fr!important}
  .media-toolbar{grid-template-columns:1fr}
  .media-panel-head{flex-direction:column}
  .dashboard-shortcuts{grid-template-columns:1fr}
}
@media(max-width:700px){
  .document-row{grid-template-columns:1fr}
  .media-panel-head{display:block}
  .media-panel-head button{margin-top:10px}
}
@media(max-width:600px){
  .top{align-items:flex-start}
  .top-actions{margin-left:auto}
  .account-trigger{padding:8px 10px;font-size:13px}
}

/* ---------- Acessibilidade ---------- */
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
</style>
