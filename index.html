<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acess Port | Multi-condomínio</title><style>
:root{--navy:#11243b;--blue:#2168d5;--gold:#e7bd4a;--bg:#f3f6fb;--ink:#17283e;--muted:#6c7b90;--line:#e0e7f0;--white:#fff;--red:#b42318;--green:#14804a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Inter,system-ui,Arial;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:var(--blue);color:#fff}button.secondary{background:#eaf0f8;color:var(--navy)}button.danger{background:#b42318}input,select{width:100%;padding:12px;border:1px solid #ccd7e5;border-radius:10px;background:white;color:var(--ink)}label{display:block;font-weight:650;margin:12px 0 6px}.hidden{display:none!important}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:white;padding:24px 16px}.brand{font-size:23px;font-weight:850;letter-spacing:.2px;margin:0 8px 5px}.brand span{color:var(--gold)}.subbrand{color:#b9c8da;font-size:12px;margin:0 8px 30px}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#dbe6f4;text-align:left}.nav button.active,.nav button:hover{background:#263e59;color:#fff}.sidefoot{margin-top:40px;color:#b9c8da;font-size:12px;padding:8px}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 28px;background:#fff;border-bottom:1px solid var(--line)}.top h1{font-size:22px;margin:0}.who{font-size:12px;color:var(--muted)}.content{padding:26px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 14px #12243b08}.stat{font-size:30px;font-weight:850;margin:6px 0}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto;margin-top:14px}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#f8fafc}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e8f7ef;color:var(--green);font-size:12px;font-weight:700}.pill.gold{background:#fff4d4;color:#7c5c00}.notice{padding:12px 14px;border-radius:10px;background:#fff4d4;color:#6b5000;margin:12px 0}.status{margin-top:12px;min-height:22px;color:var(--muted)}.error{color:var(--red)}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#10243a,#183f69)}.login{background:#fff;width:min(440px,100%);border-radius:22px;padding:30px;box-shadow:0 25px 80px #0003}.login .brand{color:var(--navy);margin:0}.login p{color:var(--muted)}.login button{width:100%;margin-top:16px}.empty{padding:25px;text-align:center;color:var(--muted)}.sectiontitle{margin:0 0 16px}.small{font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{padding:12px;position:sticky;top:0;z-index:5}.subbrand,.sidefoot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.top{padding:16px;align-items:flex-start}.content{padding:14px}.grid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.top h1{font-size:18px}}
</style></head><body>
<div id="loginScreen" class="loginwrap"><div class="login"><div class="brand">ACESS <span>PORT</span></div><p>Gestão segura de condomínios e portaria</p><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">Entrar no sistema</button></form><div class="actions" style="justify-content:center"><button type="button" id="forgotBtn" class="secondary" style="width:auto;margin-top:8px">Esqueci minha senha</button></div><form id="recoveryForm" class="hidden"><h3>Redefinir senha</h3><p class="small">Digite a nova senha para sua conta.</p><label for="newPassword">Nova senha</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Salvar nova senha</button><button type="button" id="cancelRecovery" class="secondary">Voltar ao login</button></form><div id="loginStatus" class="status" role="status" aria-live="polite"></div><p class="small">O acesso depende de uma conta criada no Supabase e de um perfil autorizado.</p></div></div>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="brand">ACESS <span>PORT</span></div><div class="subbrand">PLATAFORMA DE PORTARIA</div><nav class="nav" id="nav"></nav><div class="sidefoot">Acesso por perfil e condomínio</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Painel</h1><div class="who" id="who"></div></div><button class="secondary" id="logoutBtn">Sair</button></header><div class="content" id="content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
// A URL é o domínio do projeto. A chave pública (anon/publishable) é separada.
const SUPABASE_URL = 'https://uyakrrwqzvwlqhqjnscc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5YWtycndxenZ3bHFocWpuc2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMDQxNTYsImV4cCI6MjEwNzc4MDE1Nn0.sL_yIcxaiYYEHRdLcKpeIRpf8lbjYxMiL0g0xKrCajc';
if (!/^https:\/\/[^/]+\.supabase\.co$/.test(SUPABASE_URL)) {
  throw new Error('SUPABASE_URL inválida: use somente o domínio do projeto, não a chave da API.');
}
if (!window.supabase?.createClient) {
  throw new Error('Não foi possível carregar a biblioteca Supabase. Verifique sua conexão e tente novamente.');
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true, flowType: 'implicit' }
});
let session=null, profile=null, condos=[], homes=[], currentView='dashboard', recoveryMode=false, authListenerReady=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=(id,msg,error=false)=>{const e=$(id);if(e){e.textContent=msg;e.className='status'+(error?' error':'')}};
const friendlyError=(err)=>{
  const m=String(err?.message||err||'Erro desconhecido');
  if(/Failed to fetch|fetch failed|NetworkError/i.test(m)) return 'Não foi possível conectar ao Supabase. Confira a URL do projeto, a chave pública e a conexão. URL configurada: '+SUPABASE_URL;
  if(/Invalid API key/i.test(m)) return 'Chave pública inválida. Confira a chave em Supabase → Settings → API Keys e atualize SUPABASE_ANON_KEY no index.html.';
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos. Use “Esqueci minha senha” para solicitar uma nova recuperação.';
  if(/otp_expired|expired|invalid.*token/i.test(m)) return 'O link de recuperação expirou ou já foi utilizado. Solicite um novo link e abra somente o e-mail mais recente.';
  return m;
};
const roleLabel={admin_geral:'Administrador geral',admin_condominio:'Administrador do condomínio',porteiro:'Porteiro'};
function showLogin(){ $('loginScreen').classList.remove('hidden'); $('app').classList.add('hidden'); }
function showRecovery(){recoveryMode=true;$('loginForm').classList.add('hidden');$('forgotBtn').classList.add('hidden');$('recoveryForm').classList.remove('hidden');say('loginStatus','Defina uma nova senha com pelo menos 8 caracteres.');}
function showNormalLogin(){recoveryMode=false;$('recoveryForm').classList.add('hidden');$('loginForm').classList.remove('hidden');$('forgotBtn').classList.remove('hidden');$('newPassword').value='';$('confirmPassword').value='';say('loginStatus','');}
async function init(){
  try {
    // Link de recuperação do Supabase normalmente retorna com type=recovery no hash.
    const hash=new URLSearchParams(location.hash.replace(/^#/,' '));
    const isRecovery=hash.get('type')==='recovery' || /type=recovery/.test(location.hash);
    if (isRecovery) { showLogin(); showRecovery(); }
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    if(data?.session){session=data.session;if(!recoveryMode) await loadProfile();}
    if(!authListenerReady){authListenerReady=true;sb.auth.onAuthStateChange((event,s)=>{
      session=s;
      if(event==='PASSWORD_RECOVERY'){showLogin();showRecovery();return;}
      if(!s){profile=null;showLogin();}
      else if(!recoveryMode){setTimeout(()=>loadProfile().catch(e=>say('loginStatus',friendlyError(e),true)),0);}
    });}
  } catch(err){showLogin();say('loginStatus',friendlyError(err),true);}
}
async function loadProfile(){
  if(!session)return;
  const {data,error}=await sb.from('perfis_acesso').select('id,nome,email,papel,condominio_id,ativo').eq('id',session.user.id).maybeSingle();
  if(error||!data||!data.ativo){await sb.auth.signOut();say('loginStatus',error?friendlyError(error):'Conta sem perfil ativo. Solicite ao administrador.',true);return;}
  profile=data;$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${profile.nome||profile.email} • ${roleLabel[profile.papel]||profile.papel}`;
  await loadData();renderNav();navigate(profile.papel==='porteiro'?'operacao':'dashboard');
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const btn=$('loginButton');btn.disabled=true;say('loginStatus','Validando acesso…');
  try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;await loadProfile();}
  catch(err){say('loginStatus',friendlyError(err),true);}finally{btn.disabled=false;}
});
$('forgotBtn').addEventListener('click',async()=>{
  const email=$('email').value.trim();if(!email){say('loginStatus','Digite seu e-mail acima e clique em “Esqueci minha senha”.',true);$('email').focus();return;}
  const btn=$('forgotBtn');btn.disabled=true;say('loginStatus','Enviando solicitação de recuperação…');
  try{const redirectTo=location.origin+location.pathname;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;say('loginStatus','Se o e-mail estiver cadastrado, enviaremos um link. Abra o e-mail mais recente e use o link antes de solicitar outro.');}
  catch(err){say('loginStatus',friendlyError(err),true);}finally{btn.disabled=false;}
});
$('recoveryForm').addEventListener('submit',async e=>{
  e.preventDefault();const p=$('newPassword').value, c=$('confirmPassword').value;
  if(p.length<8){say('loginStatus','A senha precisa ter pelo menos 8 caracteres.',true);return;}
  if(p!==c){say('loginStatus','As senhas não são iguais. Confira e tente novamente.',true);return;}
  const btn=$('recoveryForm').querySelector('button[type="submit"]');btn.disabled=true;say('loginStatus','Salvando nova senha…');
  try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;await sb.auth.signOut();history.replaceState(null,document.title,location.pathname+location.search);showNormalLogin();say('loginStatus','Senha alterada com sucesso. Entre com sua nova senha.');}
  catch(err){say('loginStatus',friendlyError(err),true);}finally{btn.disabled=false;}
});
$('cancelRecovery').addEventListener('click',()=>{showNormalLogin();history.replaceState(null,document.title,location.pathname+location.search);});
$('logoutBtn').onclick=async()=>{try{await sb.auth.signOut();}catch(err){say('loginStatus',friendlyError(err),true);}};
async function loadData(){
  const c=await sb.from('condominios').select('id,nome,ativo,created_at').order('nome');if(!c.error)condos=c.data||[];else console.warn('Falha ao carregar condomínios:',c.error.message);
  const h=await sb.from('imoveis').select('id,condominio_id,quadra,lote,rua,proprietario,cep,velocidade,url').order('quadra').order('lote');if(!h.error)homes=h.data||[];else console.warn('Falha ao carregar imóveis:',h.error.message);
}
function allowedViews(){if(profile.papel==='admin_geral')return [['dashboard','Visão geral'],['condominios','Condomínios'],['usuarios','Usuários'],['imoveis','Imóveis'],['operacao','Portaria'],['qrcode','QR Code'],['segunda-tela','Segunda tela']];if(profile.papel==='admin_condominio')return [['dashboard','Visão geral'],['usuarios','Porteiros'],['imoveis','Imóveis'],['operacao','Portaria'],['qrcode','QR Code'],['segunda-tela','Segunda tela']];return [['operacao','Portaria'],['qrcode','QR Code'],['segunda-tela','Segunda tela']]}
function renderNav(){$('nav').innerHTML=allowedViews().map(([id,label])=>`<button data-view="${id}" class="${id===currentView?'active':''}">${label}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));}
function navigate(v){if(!allowedViews().some(x=>x[0]===v))v=allowedViews()[0][0];currentView=v;renderNav();$('pageTitle').textContent=allowedViews().find(x=>x[0]===v)?.[1]||'Painel';if(v==='segunda-tela'){renderSecondScreen();return}if(v==='qrcode'){renderQr();return}if(v==='condominios'){renderCondos();return}if(v==='usuarios'){renderUsers();return}if(v==='imoveis'){renderHomes();return}if(v==='operacao'){renderOperation();return}renderDashboard()}
function renderDashboard(){$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Condomínios ativos</div><div class="stat">${profile.papel==='admin_geral'?condos.filter(c=>c.ativo).length:1}</div></div><div class="card"><div class="muted">Imóveis disponíveis no seu acesso</div><div class="stat">${homes.length}</div></div><div class="card"><div class="muted">Seu perfil</div><div class="stat" style="font-size:21px">${esc(roleLabel[profile.papel])}</div><span class="pill">Acesso autorizado</span></div></div><div class="card" style="margin-top:16px"><h2 class="sectiontitle">Bem-vindo ao Acess Port</h2><p class="muted">Os menus exibidos dependem do perfil autenticado. O isolamento de dados deve ser aplicado por políticas do banco de dados.</p>${profile.papel==='admin_geral'?'<div class="actions"><button onclick="navigate(\'condominios\')">Gerenciar condomínios</button><button class="secondary" onclick="navigate(\'usuarios\')">Gerenciar usuários</button></div>':''}</div>`}
function renderCondos(){$('content').innerHTML=`<div class="card"><h2>Novo condomínio cliente</h2><form id="condoForm"><div class="formrow"><div><label>Nome do condomínio</label><input id="cNome" required maxlength="120"></div><div><label>Status</label><select id="cAtivo"><option value="true">Ativo</option><option value="false">Inativo</option></select></div></div><div class="actions"><button>Cadastrar condomínio</button></div></form><div id="condoStatus" class="status"></div></div><div class="card" style="margin-top:16px"><h2>Clientes cadastrados</h2><div class="tablewrap"><table><thead><tr><th>Condomínio</th><th>Status</th><th>ID</th></tr></thead><tbody>${condos.map(c=>`<tr><td>${esc(c.nome)}</td><td>${c.ativo?'<span class="pill">Ativo</span>':'<span class="pill gold">Inativo</span>'}</td><td class="small">${esc(c.id)}</td></tr>`).join('')||'<tr><td colspan="3">Nenhum condomínio cadastrado.</td></tr>'}</tbody></table></div></div>`;$('condoForm').onsubmit=async e=>{e.preventDefault();try{const {error}=await sb.from('condominios').insert({nome:$('cNome').value.trim(),ativo:$('cAtivo').value==='true'});if(error)throw error;say('condoStatus','Condomínio cadastrado.');await loadData();navigate('condominios');}catch(err){say('condoStatus',friendlyError(err),true);}}}
function renderUsers(){const opts=profile.papel==='admin_geral'?condos.map(c=>`<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join(''):`<option value="${esc(profile.condominio_id)}">Meu condomínio</option>`;$('content').innerHTML=`<div class="card"><h2>Criar acesso individual</h2><p class="muted">A conta é criada por função segura no servidor. A Edge Function <code>gerenciar-usuario</code> precisa estar publicada e configurada.</p><form id="userForm"><div class="formrow"><div><label>Nome</label><input id="uNome" required></div><div><label>E-mail de acesso</label><input id="uEmail" type="email" required></div><div><label>Senha inicial</label><input id="uPass" type="password" minlength="8" required autocomplete="new-password"></div><div><label>Perfil</label><select id="uRole">${profile.papel==='admin_geral'?'<option value="admin_condominio">Administrador do condomínio</option><option value="porteiro">Porteiro</option>':'<option value="porteiro">Porteiro</option>'}</select></div><div><label>Condomínio</label><select id="uCondo" required>${opts}</select></div><div><label>Conta</label><select id="uActive"><option value="true">Ativa</option><option value="false">Inativa</option></select></div></div><div class="actions"><button>Criar usuário</button></div></form><div id="userStatus" class="status"></div></div><div class="notice">A criação de usuários depende de uma função de servidor; não coloque a chave service_role no HTML.</div>`;$('userForm').onsubmit=async e=>{e.preventDefault();say('userStatus','Criando conta…');try{const {data,error}=await sb.functions.invoke('gerenciar-usuario',{body:{nome:$('uNome').value.trim(),email:$('uEmail').value.trim(),senha:$('uPass').value,papel:$('uRole').value,condominio_id:$('uCondo').value,ativo:$('uActive').value==='true'}});if(error)throw error;say('userStatus',data?.message||'Usuário criado.');$('userForm').reset();}catch(err){say('userStatus',friendlyError(err),true);}}}
function renderHomes(){const list=homes;$('content').innerHTML=`<div class="card"><h2>Cadastrar imóvel</h2><form id="homeForm"><div class="formrow"><div><label>Quadra</label><input id="hQuadra" required></div><div><label>Lote</label><input id="hLote" required></div><div><label>Rua / avenida</label><input id="hRua"></div><div><label>Proprietário</label><input id="hProp"></div><div><label>CEP</label><input id="hCep"></div><div><label>Velocidade máxima (km/h)</label><input id="hVel" type="number" min="1" value="30"></div><div style="grid-column:1/-1"><label>Link do mapa/localização</label><input id="hUrl" type="url" placeholder="https://maps.google.com/..."></div></div><div class="actions"><button>Salvar imóvel</button></div></form><div id="homeStatus" class="status"></div></div><div class="card" style="margin-top:16px"><h2>Imóveis do seu acesso (${list.length})</h2><div class="tablewrap"><table><thead><tr><th>Quadra</th><th>Lote</th><th>Rua</th><th>Proprietário</th><th>Localização</th></tr></thead><tbody>${list.map(h=>`<tr><td>${esc(h.quadra)}</td><td>${esc(h.lote)}</td><td>${esc(h.rua)}</td><td>${esc(h.proprietario)}</td><td>${h.url?`<a href="${esc(h.url)}" target="_blank" rel="noopener">Abrir mapa</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum imóvel disponível.</td></tr>'}</tbody></table></div></div>`;$('homeForm').onsubmit=async e=>{e.preventDefault();const row={quadra:$('hQuadra').value.trim(),lote:$('hLote').value.trim(),rua:$('hRua').value.trim(),proprietario:$('hProp').value.trim(),cep:$('hCep').value.trim()||null,velocidade:Number($('hVel').value)||30,url:$('hUrl').value.trim()||null};if(profile.papel==='admin_geral'){say('homeStatus','O cadastro de imóvel pelo administrador geral exige selecionar um condomínio. Esse seletor ainda precisa ser implementado.',true);return;}row.condominio_id=profile.condominio_id;try{const {error}=await sb.from('imoveis').insert(row);if(error)throw error;say('homeStatus','Imóvel salvo.');await loadData();renderHomes();}catch(err){say('homeStatus',friendlyError(err),true);}}}
function renderOperation(){$('content').innerHTML=`<div class="card"><h2>Operação da portaria</h2><p class="muted">A sessão está vinculada a ${esc(profile.papel==='admin_geral'?'Administração geral':(condos.find(c=>c.id===profile.condominio_id)?.nome||'seu condomínio'))}.</p><div class="grid"><div class="card"><div class="muted">Imóveis visíveis</div><div class="stat">${homes.length}</div></div><div class="card"><div class="muted">Perfil operacional</div><div class="stat" style="font-size:20px">${esc(roleLabel[profile.papel])}</div></div><div class="card"><div class="muted">QR Code</div><button onclick="navigate('qrcode')">Abrir QR Code</button></div></div><h3>Localizar imóvel</h3><label>Buscar quadra, lote ou proprietário</label><input id="homeSearch" placeholder="Digite para filtrar…"><div id="operationResults" class="tablewrap"></div></div>`;const draw=()=>{const q=$('homeSearch').value.toLowerCase();const arr=homes.filter(h=>[h.quadra,h.lote,h.rua,h.proprietario].join(' ').toLowerCase().includes(q));$('operationResults').innerHTML=`<table><thead><tr><th>Quadra</th><th>Lote</th><th>Rua</th><th>Proprietário</th><th>Ação</th></tr></thead><tbody>${arr.map(h=>`<tr><td>${esc(h.quadra)}</td><td>${esc(h.lote)}</td><td>${esc(h.rua)}</td><td>${esc(h.proprietario)}</td><td>${h.url?`<a target="_blank" rel="noopener" href="${esc(h.url)}">Abrir mapa</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum resultado.</td></tr>'}</tbody></table>`;};$('homeSearch').oninput=draw;draw();}
function renderQr(){$('content').innerHTML=`<div class="card" style="text-align:center"><h2>QR Code do portal</h2><p class="muted">Este QR Code aponta para a página pública configurada no seu sistema. Configure a URL pública abaixo antes de imprimir.</p><label style="text-align:left">URL pública do portal</label><input id="qrUrl" type="url" placeholder="https://seu-dominio.com/portao" value="${esc(location.href.split('?')[0])}"><div id="qrImage" style="display:inline-block;margin:20px;background:#fff;padding:16px;border:1px solid var(--line);min-height:100px"></div><div class="actions" style="justify-content:center"><button id="makeQr">Gerar QR Code</button><button class="secondary" onclick="window.print()">Imprimir página</button></div><div class="status" id="qrStatus"></div></div>`;$('makeQr').onclick=()=>{const u=$('qrUrl').value.trim();if(!u){say('qrStatus','Informe uma URL válida.',true);return;}const box=$('qrImage');box.innerHTML=`<img alt="QR Code" width="280" height="280" src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(u)}">`;say('qrStatus','QR Code gerado. Confirme a URL antes de imprimir.');};$('makeQr').click();}
function renderSecondScreen(){$('content').innerHTML=`<div class="card" style="text-align:center;padding:50px 20px"><div class="brand" style="color:var(--navy)">ACESS <span>PORT</span></div><h2>Segunda tela da portaria</h2><p class="muted">Tela de exibição. O conteúdo será exibido isoladamente quando esta página for aberta em uma janela ou monitor separado.</p><button onclick="window.open(location.href+'?view=segunda-tela','acessport-segunda-tela','width=900,height=650')">Abrir janela da segunda tela</button></div>`;}
init();
</script></body></html>
